<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athyx Network</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="themes.css">
  <script src="themes.js"></script>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="shortcut icon" href="favicon.ico">

  <style>
    :root {
      color-scheme: dark;
      --bg: #0c0406;
      --surface: #190a0e;
      --surface-hover: #251016;
      --surface-active: #35161f;
      --border: rgba(244, 63, 94, 0.16);
      --border-hover: rgba(244, 63, 94, 0.32);
      --text: #fff1f2;
      --text-muted: #fecdd3;
      --text-dim: #f43f5e;
      --accent: #f43f5e;
      --accent-dim: rgba(244, 63, 94, 0.18);
      --accent-glow: rgba(244, 63, 94, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: 
        linear-gradient(135deg, var(--accent-dim) 0%, rgba(0, 0, 0, 0) 55%),
        linear-gradient(180deg, var(--surface-active) 0%, var(--surface) 40%, var(--bg) 100%);
      background-color: var(--bg);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px 100px;
      position: relative;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    
    .dork-box {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 12px 20px 12px 14px;
      margin-bottom: 24px;
      box-shadow: 
        0 10px 30px -8px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.02);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      max-width: 480px;
      text-align: left;
    }

    .dork-box:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 
        0 14px 36px -8px rgba(0, 0, 0, 0.7),
        0 0 20px -4px var(--accent-glow);
    }

    .dork-box img {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .dork-box-content {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .dork-box-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .dork-box-sub {
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .dork-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--accent-dim);
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border: 1px solid rgba(244, 63, 94, 0.3);
    }

    .title {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(2.4rem, 5vw, 3.4rem);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.03em;
      margin-bottom: 24px;
      background: linear-gradient(180deg, #ffffff 30%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    
    .search-container {
      width: 100%;
      max-width: 620px;
      margin: 0 auto 18px auto;
      position: relative;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 6px 10px 6px 18px;
      box-shadow: 
        0 12px 30px -10px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.02);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .search-box:focus-within {
      border-color: var(--accent);
      box-shadow: 
        0 16px 36px -10px rgba(0, 0, 0, 0.8),
        0 0 0 2px var(--accent-dim);
      background: var(--surface-hover);
    }

    .search-box i.search-icon {
      color: var(--text-dim);
      font-size: 16px;
      margin-right: 12px;
      transition: color 0.2s;
      cursor: pointer;
    }

    .search-box:focus-within i.search-icon {
      color: var(--accent);
    }

    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      padding: 10px 0;
    }

    .search-box input::placeholder {
      color: var(--text-dim);
    }

    .search-btn {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      font-family: inherit;
    }

    .search-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .kbd-badge {
      font-size: 10px;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 5px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #d4d4d8;
    }

    
    .quick-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .chip {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 9999px;
      padding: 6px 14px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .chip i {
      font-size: 12px;
    }

    .chip:hover {
      background: var(--surface-hover);
      color: #fff;
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    
    .popular-section {
      margin-top: 36px;
      padding: 24px 0;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      width: 100%;
    }

    .popular-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
    }

    .pop-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .pop-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 
        0 12px 26px -6px rgba(0, 0, 0, 0.7),
        0 0 16px -2px var(--accent-glow);
    }

    .pop-thumb-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pop-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease;
    }

    .pop-card:hover .pop-thumb {
      transform: scale(1.08);
    }

    .pop-fallback-icon {
      font-size: 32px;
      color: var(--text-dim);
    }

    .pop-play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
      backdrop-filter: blur(2px);
    }

    .pop-card:hover .pop-play-overlay {
      opacity: 1;
    }

    .pop-play-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      transform: scale(0.85);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 0 14px var(--accent-glow);
      padding-left: 2px;
    }

    .pop-card:hover .pop-play-icon {
      transform: scale(1);
    }

    .pop-info {
      padding: 10px 10px 12px;
      text-align: center;
    }

    .pop-title {
      font-size: 13px;
      font-weight: 600;
      color: #f4f4f5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .pop-card:hover .pop-title {
      color: #fff;
    }

    
    #searchOverlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: none;
      z-index: 9999;
    }

    #searchOverlay.show {
      display: block;
    }

    #overlayFrame {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    @media (max-width: 600px) {
      .title {
        font-size: 2.2rem;
      }
      .popular-grid {
        grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
        gap: 10px;
      }
      .pop-info {
        padding: 8px 6px;
      }
      .pop-title {
        font-size: 11.5px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    
    <div class="dork-box">
      <img src="https://cdn.jsdelivr.net/gh/athyx-network/Athyx-Network@main/hrmf.png" alt="hrmf">
      <div class="dork-box-content">
        <div class="dork-box-title">
          <span>Find overweight dorks in your area</span>
          <span class="dork-badge"><i class="fa-solid fa-location-dot"></i> Nearby</span>
        </div>
        <span class="dork-box-sub">Connect with local dorks today!</span>
      </div>
    </div>
    <h1 class="title">Welcome to Athyx Network</h1>

    
    <div class="search-container">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass search-icon" id="searchIcon"></i>
        <input type="text" id="searchInput" placeholder="Search with Google or enter a web URL..." autocomplete="off" spellcheck="false">
        <button class="search-btn" id="searchBtn" title="Press Enter to Search">
          <span>Search</span>
          <span class="kbd-badge">↵</span>
        </button>
      </div>
    </div>

    
    <div class="quick-chips">
      <button class="chip" onclick="quickSearch('https://www.youtube.com')">
        <i class="fa-brands fa-youtube"></i> YouTube
      </button>
      <button class="chip" onclick="quickSearch('https://www.tiktok.com')">
        <i class="fa-brands fa-tiktok"></i> TikTok
      </button>
    </div>

    
    <div class="popular-section">
      <div class="popular-grid" id="popularGrid"></div>
    </div>

  </div>

  
  <div id="searchOverlay">
    <iframe id="overlayFrame" title="Web Search Viewer"></iframe>
  </div>

  <script>
    const REPO_BASE = "https://cdn.jsdelivr.net/gh/athyx-network/game-library@main/";

    const POPULAR_GAMES = [
      { name: "Slope", path: "Slope 2.html", icon: "icons/slope_2.png" },
      { name: "Geometry Dash", path: "Geometry Dash.html", icon: "icons/geometry_dash.svg" },
      { name: "Snow Rider 3D", path: "Snow Rider.html", icon: "icons/snow_rider.png" },
      { name: "Cookie Clicker", path: "Cookie Clicker.html", icon: "icons/cookie_clicker.png" },
      { name: "Block Blast", path: "Block Blast.html", icon: "icons/block_blast.png" },
      { name: "Raldi's Crackhouse", path: "Raldis Crackhouse.html", icon: "icons/raldis_crackhouse.png" }
    ];

    function renderPopularGames() {
      const grid = document.getElementById("popularGrid");
      if (!grid) return;
      grid.innerHTML = "";

      POPULAR_GAMES.forEach(game => {
        const rawIcon = game.icon ? (game.icon.startsWith("http") ? game.icon : REPO_BASE + encodeURI(game.icon)) : "";
        const card = document.createElement("div");
        card.className = "pop-card";
        card.onclick = () => launchPopularGame(game);

        card.innerHTML = `
          <div class="pop-thumb-wrapper">
            ${rawIcon ? `<img class="pop-thumb" src="${rawIcon}" alt="${game.name}" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">` : ""}
            <i class="fa-solid fa-gamepad pop-fallback-icon" style="${rawIcon ? 'display:none;' : ''}"></i>
            <div class="pop-play-overlay">
              <div class="pop-play-icon"><i class="fa-solid fa-play"></i></div>
            </div>
          </div>
          <div class="pop-info">
            <span class="pop-title" title="${game.name}">${game.name}</span>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function launchPopularGame(game) {
      sessionStorage.setItem("athyx_launch_game", JSON.stringify(game));
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ action: "navigate", tab: "games" }, "*");
      } else {
        window.location.href = "g.html";
      }
    }

    const searchInput = document.getElementById("searchInput");
    const searchBtn = document.getElementById("searchBtn");
    const searchIcon = document.getElementById("searchIcon");
    const searchOverlay = document.getElementById("searchOverlay");
    const overlayFrame = document.getElementById("overlayFrame");

    function performSearch(customQuery) {
      let query = customQuery || searchInput.value.trim();
      if (!query) return;

      if (!/^https?:\/\//i.test(query)) {
        if (/^([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(\/.*)?$/i.test(query)) {
          query = "https://" + query;
        } else {
          query = "https://www.google.com/search?q=" + encodeURIComponent(query);
        }
      }

      const proxyUrl = "/scramjet/index.html#" + encodeURIComponent(query);
      overlayFrame.src = proxyUrl;
      searchOverlay.classList.add("show");
    }

    function quickSearch(url) {
      performSearch(url);
    }

    function closeOverlay() {
      searchOverlay.classList.remove("show");
      overlayFrame.src = "about:blank";
    }

    searchInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        performSearch();
        e.preventDefault();
      }
    });

    searchBtn.addEventListener("click", () => performSearch());
    searchIcon.addEventListener("click", () => performSearch());

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && searchOverlay.classList.contains("show")) {
        closeOverlay();
      }
    });

    renderPopularGames();
  </script>

</body>
</html>
