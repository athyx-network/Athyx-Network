<!DOCTYPE html>
<html lang="en">
<head>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DGZ6VYV4BG"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-DGZ6VYV4BG');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athyx Proxy</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/gh/Destroyed12121/Staticsj@main/JS/scramjet.all.js" defer></script>
    <script type="module">
        import * as BareMux from "https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux/dist/index.mjs";
        window.BareMux = BareMux;
    </script>
    <link rel="stylesheet" href="../themes.css">
    <link rel="stylesheet" href="style.css">
    <script src="../themes.js"></script>
    <script src="./script.js" defer></script>
</head>

<body>
    <div id="app"></div>

    <div class="wisp-settings-modal hidden" id="wisp-settings-modal">
        <div class="settings-card">
            <div class="settings-header">
                <h2><i class="fa-solid fa-sliders" style="color:var(--accent);"></i> Proxy Settings</h2>
                <button class="close-btn" id="close-wisp-modal" title="Close"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="settings-content">
                <div class="section-title"><i class="fa-solid fa-cloud"></i> Select Server</div>
                <div class="server-list" id="server-list"></div>
            </div>
        </div>
    </div>

    <script>
        
        function cloakPage() {
            if (window.self !== window.top) return;
            const newWin = window.open("about:blank", "_blank");
            if (!newWin) { alert("Popup blocked!"); return; }
            newWin.document.write(`<!DOCTYPE html>
<html>
<head>
<title>${document.title}</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;}
iframe{width:100%;height:100%;border:none;}
</style>
</head>
<body>
<iframe src="${window.location.href}"></iframe>
</body>
</html>`);
            newWin.document.close();
            window.close();
        }

        
        window.addEventListener("load", () => {
            if (localStorage.getItem("autoCloak") === "1" && window.self === window.top) {
                cloakPage();
            }
        });
    </script>
</body>
</html>
