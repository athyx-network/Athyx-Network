<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg: #09090b;
      --surface: #121215;
      --surface-hover: #18181c;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.16);
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --text-dim: #71717a;
      --accent: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px 80px;
      position: relative;
      overflow-x: hidden;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Ambient lighting */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 10%, rgba(255, 255, 255, 0.03) 0%, rgba(9, 9, 11, 0.7) 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    /* Title */
    .title {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(2.4rem, 5vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 28px;
      background: linear-gradient(180deg, #ffffff 30%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Search Box */
    .search-box {
      display: flex;
      align-items: center;
      background: rgba(18, 18, 22, 0.95);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 6px 10px 6px 18px;
      box-shadow: 
        0 12px 30px -10px rgba(0, 0, 0, 0.6),
        0 0 0 1px rgba(255, 255, 255, 0.02);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      margin-bottom: 36px;
    }

    .search-box:focus-within {
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 
        0 16px 36px -10px rgba(0, 0, 0, 0.8),
        0 0 0 2px rgba(255, 255, 255, 0.08);
      background: #151519;
    }

    .search-box i.search-icon {
      color: var(--text-dim);
      font-size: 15px;
      margin-right: 12px;
      transition: color 0.2s;
    }

    .search-box:focus-within i.search-icon {
      color: #fff;
    }

    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: inherit;
      font-size: 14.5px;
      padding: 10px 0;
    }

    .search-box input::placeholder {
      color: var(--text-dim);
    }

    .engine-select {
      background: #27272a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      color: var(--text-muted);
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      font-family: inherit;
      transition: all 0.2s;
    }

    .engine-select:hover {
      background: #3f3f46;
      color: #fff;
    }

    /* Shortcuts Grid */
    .shortcuts {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      max-width: 580px;
      margin: 0 auto;
    }

    .shortcut {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      cursor: pointer;
      user-select: none;
    }

    .shortcut-icon {
      width: 56px;
      height: 56px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: var(--text-muted);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .shortcut:hover .shortcut-icon {
      background: var(--surface-hover);
      border-color: var(--border-hover);
      transform: translateY(-3px);
      color: #fff;
      box-shadow: 0 10px 20px -8px rgba(0, 0, 0, 0.6);
    }

    .shortcut-label {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-dim);
      text-align: center;
      max-width: 70px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color 0.2s;
    }

    .shortcut:hover .shortcut-label {
      color: var(--text);
    }

    /* Loader */
    .loader {
      position: fixed;
      inset: 0;
      background: rgba(9, 9, 11, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .loader.show {
      display: flex;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

  <div class="loader" id="loader">
    <div class="spinner"></div>
  </div>

  <div class="container">
    <h1 class="title">Welcome to Athyx Network</h1>

    <form class="search-box" id="searchForm">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="searchInput" placeholder="Search the web or enter a URL..." autocomplete="off" spellcheck="false">
      <select class="engine-select" id="engine" title="Search Engine">
        <option value="https://www.google.com/search?q=">Google</option>
        <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
        <option value="https://search.brave.com/search?q=">Brave</option>
      </select>
    </form>

    <div class="shortcuts" id="shortcuts">
      <div class="shortcut" data-url="https://www.youtube.com">
        <div class="shortcut-icon"><i class="fa-brands fa-youtube"></i></div>
        <span class="shortcut-label">YouTube</span>
      </div>

      <div class="shortcut" data-url="https://www.google.com">
        <div class="shortcut-icon"><i class="fa-brands fa-google"></i></div>
        <span class="shortcut-label">Google</span>
      </div>

      <div class="shortcut" data-url="https://github.com">
        <div class="shortcut-icon"><i class="fa-brands fa-github"></i></div>
        <span class="shortcut-label">GitHub</span>
      </div>

      <div class="shortcut" data-url="https://discord.com">
        <div class="shortcut-icon"><i class="fa-brands fa-discord"></i></div>
        <span class="shortcut-label">Discord</span>
      </div>

      <div class="shortcut" data-url="https://en.wikipedia.org">
        <div class="shortcut-icon"><i class="fa-brands fa-wikipedia-w"></i></div>
        <span class="shortcut-label">Wikipedia</span>
      </div>

      <div class="shortcut" id="addShortcut">
        <div class="shortcut-icon"><i class="fa-solid fa-plus"></i></div>
        <span class="shortcut-label">Add</span>
      </div>
    </div>
  </div>

  <script>
    const $ = s => document.querySelector(s);

    const nav = url => {
      $('#loader').classList.add('show');
      window.parent?.postMessage({ type: 'navigate', url }, '*');
    };

    // Search Form
    $('#searchForm').onsubmit = e => {
      e.preventDefault();
      let q = $('#searchInput').value.trim();
      if (!q) return;

      if (!/^https?:\/\//i.test(q)) {
        if (/^([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(\/.*)?$/i.test(q)) {
          q = 'https://' + q;
        } else {
          q = $('#engine').value + encodeURIComponent(q);
        }
      }
      nav(q);
    };

    // Shortcuts Click Delegation
    $('#shortcuts').onclick = e => {
      const shortcut = e.target.closest('.shortcut[data-url]');
      const addBtn = e.target.closest('#addShortcut');

      if (shortcut) {
        nav(shortcut.dataset.url);
      } else if (addBtn) {
        const name = prompt("Shortcut name:");
        if (!name) return;
        let url = prompt("URL (e.g. https://example.com):");
        if (!url) return;
        if (!url.startsWith('http')) url = 'https://' + url;

        const shortcuts = JSON.parse(localStorage.getItem('shortcuts') || '[]');
        shortcuts.push({ name, url });
        localStorage.setItem('shortcuts', JSON.stringify(shortcuts));
        renderCustom();
      }
    };

    function renderCustom() {
      document.querySelectorAll('.custom-shortcut').forEach(e => e.remove());
      const shortcuts = JSON.parse(localStorage.getItem('shortcuts') || '[]');
      const addBtn = $('#addShortcut');

      shortcuts.forEach(s => {
        const div = document.createElement('div');
        div.className = 'shortcut custom-shortcut';
        div.dataset.url = s.url;
        div.innerHTML = `
          <div class="shortcut-icon"><i class="fa-solid fa-link"></i></div>
          <span class="shortcut-label">${s.name}</span>
        `;
        addBtn.before(div);
      });
    }

    renderCustom();
  </script>

</body>
</html>
