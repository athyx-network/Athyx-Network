<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Web Proxy</title>
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
        <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous"/>
        <link rel="stylesheet" href="style.css?v=8">
        <script src="JS/scramjet.all.js?v=8"></script>
        <script src="B/index.js?v=8"></script>
        <script src="prxxry.config.js?v=8"></script>
        <script src="script.js?v=8"></script>
    </head>
    <body>
        <div id="app"></div>
        
        <!-- WISP Settings Modal -->
        <div class="wisp-settings-modal modal-overlay hidden" id="wisp-settings-modal">
            <div class="modal-container wisp-settings-container">
                <div class="modal-header">
                    <h3>WISP Settings</h3>
                    <button class="modal-close-btn" id="close-wisp-modal">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M18 6 6 18M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
                
                <div class="modal-body">
                    <div class="wisp-section">
                        <h4>Servers:</h4>
                        <div class="predefined-wisps">
                            <div class="wisp-option" data-url="wss://lunarrr.eminescusm.ro/w/">
                                <div class="wisp-option-header">
                                    <span class="wisp-option-name">Lunar Proxy</span>
                                    <button class="wisp-option-btn" data-action="select-wisp">Select</button>
                                </div>
                                <div class="wisp-option-url">wss://lunarrr.eminescusm.ro/w/</div>
                                <div class="wisp-option-description">Primary proxy server (Lunar)</div>
                            </div>
                            <div class="wisp-option" data-url="wss://wisp.mercurywork.shop/">
                                <div class="wisp-option-header">
                                    <span class="wisp-option-name">Mercury Workshop</span>
                                    <button class="wisp-option-btn" data-action="select-wisp">Select</button>
                                </div>
                                <div class="wisp-option-url">wss://wisp.mercurywork.shop/</div>
                                <div class="wisp-option-description">Mercury Workshop official WISP server</div>
                            </div>
                        </div>
                    </div>

                </div>
                
                <div class="modal-footer">
                    <button class="btn btn-secondary" id="close-wisp-modal-footer">Close</button>
                    <button class="btn btn-primary" id="apply-wisp-btn" disabled>Apply Changes</button>
                </div>
            </div>
        </div>
    </body>
</html>
