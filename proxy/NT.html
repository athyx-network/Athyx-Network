<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Tab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Outfit', sans-serif;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
    body {
      background: #0d0d0e;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      overflow: hidden;
      padding: 1.5rem;
    }

    h1.clock {
      font-size: 3.8rem;
      margin-bottom: 1.25rem;
      font-weight: 700;
      letter-spacing: -1px;
      color: #ffffff;
      animation: fadeIn 0.4s ease-out;
    }

    .search-container {
      display: flex;
      align-items: center;
      background: #141416;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 14px 6px 20px;
      border-radius: 9999px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      width: 580px;
      max-width: 92%;
      transition: all 0.2s ease;
    }

    .search-container:focus-within {
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.05), 0 12px 35px rgba(0, 0, 0, 0.6);
    }

    .search-container i.search-icon {
      color: #8e8e93;
      font-size: 0.95rem;
      margin-right: 12px;
    }

    .search-container input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 0.98rem;
      padding: 8px 0;
    }

    .search-container input::placeholder {
      color: #8e8e93;
    }

    .search-container select {
      background: #101012;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #8e8e93;
      border-radius: 9999px;
      padding: 6px 14px;
      margin-left: 10px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 500;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-container select:hover {
      background: #18181c;
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.16);
    }

    .icons {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
      margin-top: 32px;
      max-width: 520px;
      width: 100%;
    }

    .shortcut-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #8e8e93;
      width: 100%;
      cursor: pointer;
    }

    .icon {
      width: 64px;
      height: 64px;
      background: #141416;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      margin-bottom: 8px;
    }

    .shortcut-item:hover .icon {
      transform: translateY(-3px);
      background: #18181c;
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .shortcut-label {
      font-size: 0.78rem;
      font-weight: 500;
      color: #8e8e93;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      transition: color 0.2s;
    }

    .shortcut-item:hover .shortcut-label {
      color: #ffffff;
    }

    .icon img {
      width: 26px;
      height: 26px;
      filter: brightness(0) invert(1);
      opacity: 0.85;
      transition: opacity 0.2s;
    }

    .shortcut-item:hover .icon img {
      opacity: 1;
    }

    .icon.add-new span {
      font-size: 1.6rem;
      font-weight: 300;
      color: #8e8e93;
      transition: color 0.2s;
    }

    .shortcut-item:hover .icon.add-new span {
      color: #ffffff;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.96);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Loading Spinner */
    .loading-spinner-overlay {
      position: fixed;
      inset: 0;
      background: rgba(13, 13, 14, 0.85);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .loading-spinner-overlay.show {
      display: flex;
    }

    .loading-spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Loading Spinner -->
  <div class="loading-spinner-overlay" id="loadingSpinner">
    <div class="loading-spinner"></div>
  </div>

  <h1 class="clock">00:00</h1>

  <form id="searchForm" class="search-container">
    <i class="fa-solid fa-magnifying-glass search-icon"></i>
    <input type="text" id="searchInput" placeholder="Search the web or enter URL..." autocomplete="off">
    <select id="engineSelect">
      <option value="https://search.brave.com/search?q=" selected>Brave</option>
      <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
      <option value="https://www.google.com/search?safe=active&q=">Google</option>
      <option value="https://www.bing.com/search?q=">Bing</option>
    </select>
  </form>

  <div class="icons">
    <div class="shortcut-item">
      <a href="https://youtube.com" class="icon"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/youtube.svg" alt="YouTube"></a>
      <span class="shortcut-label">YouTube</span>
    </div>
    <div class="shortcut-item">
      <a href="https://github.com" class="icon"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/github.svg" alt="GitHub"></a>
      <span class="shortcut-label">GitHub</span>
    </div>
    <div class="shortcut-item">
      <a href="https://mail.google.com" class="icon"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/gmail.svg" alt="Gmail"></a>
      <span class="shortcut-label">Gmail</span>
    </div>
    <div class="shortcut-item">
      <a href="https://twitter.com" class="icon"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/x.svg" alt="X"></a>
      <span class="shortcut-label">X</span>
    </div>
    <div class="shortcut-item">
      <a href="https://discord.com" class="icon"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/discord.svg" alt="Discord"></a>
      <span class="shortcut-label">Discord</span>
    </div>
    <div class="shortcut-item">
      <a href="https://spotify.com" class="icon"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/spotify.svg" alt="Spotify"></a>
      <span class="shortcut-label">Spotify</span>
    </div>
    <div class="shortcut-item">
      <a href="https://openai.com" class="icon"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/openai.svg" alt="OpenAI"></a>
      <span class="shortcut-label">ChatGPT</span>
    </div>
    <div class="shortcut-item">
      <a href="https://reddit.com" class="icon"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/reddit.svg" alt="Reddit"></a>
      <span class="shortcut-label">Reddit</span>
    </div>
    <div class="shortcut-item">
      <a href="https://twitch.tv" class="icon"><img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/twitch.svg" alt="Twitch"></a>
      <span class="shortcut-label">Twitch</span>
    </div>
    <div class="shortcut-item">
      <div class="icon add-new" id="addNewShortcut">
        <span>+</span>
      </div>
      <span class="shortcut-label">Add New</span>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const time = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      document.querySelector('.clock').textContent = time;
    }
    setInterval(updateClock, 1000);
    updateClock();

    document.getElementById("searchForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const query = document.getElementById("searchInput").value.trim();
      const engine = document.getElementById("engineSelect").value;
      const urlToOpen = query.startsWith('http://') || query.startsWith('https://') || query.includes('.') && !query.includes(' ')
        ? (query.startsWith('http') ? query : 'https://' + query)
        : engine + encodeURIComponent(query);

      if (query && window.parent) {
        const loadingSpinner = document.getElementById('loadingSpinner');
        if (loadingSpinner) {
          loadingSpinner.classList.add('show');
        }

        requestAnimationFrame(() => {
          window.parent.postMessage({ type: 'navigate', url: urlToOpen }, '*');
        });
      }
    });

    document.querySelectorAll('.shortcut-item > a.icon').forEach(link => {
      link.addEventListener('click', function (event) {
        event.preventDefault();
        const urlToOpen = this.href;
        if (window.parent) {
          const loadingSpinner = document.getElementById('loadingSpinner');
          if (loadingSpinner) {
            loadingSpinner.classList.add('show');
          }

          requestAnimationFrame(() => {
            window.parent.postMessage({ type: 'navigate', url: urlToOpen }, '*');
          });
        }
      });
    });

    function loadShortcuts() {
      const shortcuts = JSON.parse(localStorage.getItem('shortcuts') || '[]');
      const container = document.querySelector('.icons');
      const addButton = document.getElementById('addNewShortcut');

      document.querySelectorAll('.shortcut-item.custom-shortcut').forEach(el => el.remove());

      const icons = ['fa-link', 'fa-bookmark', 'fa-star', 'fa-compass', 'fa-fire'];

      shortcuts.forEach(shortcut => {
        const randomIcon = icons[Math.floor(Math.random() * icons.length)];

        const div = document.createElement('div');
        div.className = 'shortcut-item custom-shortcut';

        div.innerHTML = `
          <a href="${shortcut.url}" class="icon">
            <i class="fa-solid ${randomIcon}" style="font-size: 24px; color: #fff;"></i>
          </a>
          <span class="shortcut-label">${shortcut.name}</span>
        `;

        const a = div.querySelector('a');
        a.addEventListener('click', function (event) {
          event.preventDefault();
          const urlToOpen = this.href;
          if (window.parent) {
            const loadingSpinner = document.getElementById('loadingSpinner');
            if (loadingSpinner) {
              loadingSpinner.classList.add('show');
            }

            requestAnimationFrame(() => {
              window.parent.postMessage({ type: 'navigate', url: urlToOpen }, '*');
            });
          }
        });

        container.insertBefore(div, addButton.parentNode);
      });
    }

    document.getElementById('addNewShortcut').addEventListener('click', () => {
      const name = prompt("Enter shortcut name:");
      if (!name) return;

      let url = prompt("Enter shortcut URL:");
      if (!url) return;

      if (!url.startsWith('http')) {
        url = 'https://' + url;
      }

      const shortcuts = JSON.parse(localStorage.getItem('shortcuts') || '[]');
      shortcuts.push({ name, url });
      localStorage.setItem('shortcuts', JSON.stringify(shortcuts));

      loadShortcuts();
    });

    loadShortcuts();
  </script>
</body>
</html>
