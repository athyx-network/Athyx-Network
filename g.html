<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athyx Arcade</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="themes.css">
  <script src="themes.js"></script>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="shortcut icon" href="favicon.ico">

  <style>
    :root {
      color-scheme: dark;
      --bg: #0c0406;
      --surface: #190a0e;
      --surface-hover: #251016;
      --border: rgba(244, 63, 94, 0.16);
      --border-hover: rgba(244, 63, 94, 0.32);
      --text: #fff1f2;
      --text-muted: #fecdd3;
      --text-dim: #f43f5e;
      --accent: #f43f5e;
      --accent-dim: rgba(244, 63, 94, 0.18);
      --accent-glow: rgba(244, 63, 94, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    
    #topBar {
      position: sticky;
      top: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 100;
    }

    .controls-section {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 500px;
      justify-content: center;
    }

    
    .search-wrapper {
      position: relative;
      width: 100%;
      max-width: 500px;
      display: flex;
      align-items: center;
    }

    .search-wrapper i.search-icon {
      position: absolute;
      left: 12px;
      font-size: 13px;
      color: var(--text-dim);
      pointer-events: none;
      transition: color 0.2s ease;
    }

    .search-wrapper:focus-within i.search-icon {
      color: var(--accent);
    }

    #searchBox {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 32px 8px 34px;
      font-size: 13.5px;
      color: var(--text);
      font-family: inherit;
      outline: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #searchBox::placeholder {
      color: var(--text-dim);
    }

    #searchBox:focus {
      border-color: var(--accent);
      background: var(--surface-hover);
      box-shadow: 0 0 0 2px var(--accent-dim);
    }

    .clear-search-btn {
      position: absolute;
      right: 10px;
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 13px;
      cursor: pointer;
      display: none;
      transition: color 0.2s ease;
    }

    .clear-search-btn:hover {
      color: var(--accent);
    }

    
    .main-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 28px 120px;
    }

    
    #gamesGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 18px;
    }

    .game-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      user-select: none;
    }

    .game-card:hover {
      transform: translateY(-4px);
      background: var(--surface-hover);
      border-color: var(--border-hover);
      box-shadow: 0 16px 30px -10px rgba(0, 0, 0, 0.7);
    }

    .thumb-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #18181c;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .game-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .game-card:hover .game-thumb {
      transform: scale(1.08);
    }

    .thumb-fallback {
      font-size: 36px;
      color: var(--text-dim);
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .play-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      color: #09090b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transform: scale(0.85);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      padding-left: 3px;
    }

    .game-card:hover .play-overlay {
      opacity: 1;
    }

    .game-card:hover .play-icon {
      transform: scale(1);
    }

    .fav-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #a1a1aa;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      cursor: pointer;
      opacity: 0;
      transition: all 0.2s;
      z-index: 2;
    }

    .game-card:hover .fav-btn,
    .fav-btn.active {
      opacity: 1;
    }

    .fav-btn.active {
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
    }

    .fav-btn:hover {
      transform: scale(1.15);
      color: #ffffff;
    }

    .game-info {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .game-title {
      font-size: 13.5px;
      font-weight: 600;
      color: #f4f4f5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .game-card:hover .game-title {
      color: #fff;
    }

    
    .state-message {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: var(--text-dim);
      font-size: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .state-message i {
      font-size: 36px;
      color: var(--text-muted);
    }

    
    #gameStage {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 99999;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    #gameStage.show {
      display: flex;
    }

    #gameStage::-webkit-scrollbar,
    #gameStageIframe::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    body.game-active {
      overflow: hidden !important;
    }

    body.game-active::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    
    .stage-quit-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 100000;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(18, 18, 22, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f43f5e;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.6);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
      opacity: 0.85;
    }

    .stage-quit-btn:hover {
      opacity: 1;
      background: #ef4444;
      border-color: #ef4444;
      color: #ffffff;
      transform: scale(1.08);
      box-shadow: 0 10px 28px -2px rgba(239, 68, 68, 0.5);
    }

    .stage-quit-btn:active {
      transform: scale(0.95);
    }

    #gameStageIframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
      overflow: hidden;
    }

    
    #loadingModal {
      position: fixed;
      inset: 0;
      background: rgba(9, 9, 11, 0.8);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      z-index: 100000;
      color: #fff;
    }

    #loadingModal.show {
      display: flex;
    }

    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 600px) {
      #topBar {
        padding: 12px 16px;
      }
      .main-content {
        padding: 16px 16px 120px;
      }
      #gamesGrid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 12px;
      }
    }
  </style>
</head>

<body>

  
  <header id="topBar">
    <div class="controls-section">
      <div class="search-wrapper">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="searchBox" placeholder="Search games..." autocomplete="off" spellcheck="false">
        <button class="clear-search-btn" id="clearSearchBtn" title="Clear search"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>
  </header>

  
  <main class="main-content">
    
    <div id="gamesGrid">
      <div class="state-message">
        <div class="loading-spinner"></div>
        <span>Fetching game library...</span>
      </div>
    </div>
  </main>

  
  <div id="gameStage">
    <button class="stage-quit-btn" onclick="closeActiveGame()" title="Quit Game (Esc)" aria-label="Quit Game">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <iframe id="gameStageIframe" allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write; cross-origin-isolated" scrolling="no"></iframe>
  </div>

  
  <div id="loadingModal">
    <div class="loading-spinner"></div>
    <div id="loadingModalText">Preparing game assets...</div>
  </div>

  <script>
    const REPO_BASE = "https://cdn.jsdelivr.net/gh/athyx-network/game-library@main/";
    const GAMES_JSON_URL = REPO_BASE + "games.json";

    let allGames = [];
    let currentFilter = "all";
    let activeGameObj = null;
    let favorites = JSON.parse(localStorage.getItem("athyx_favorites") || "[]");

    const gridEl = document.getElementById("gamesGrid");
    const countPill = document.getElementById("gameCountPill");
    const searchBox = document.getElementById("searchBox");
    const clearSearchBtn = document.getElementById("clearSearchBtn");
    const gameStage = document.getElementById("gameStage");
    const gameStageIframe = document.getElementById("gameStageIframe");
    const loadingModal = document.getElementById("loadingModal");
    const loadingModalText = document.getElementById("loadingModalText");

    
    const fallbackGames = [
      { "name": "2048", "path": "2048.html", "icon": "icons/2048.png" },
      { "name": "Angry Birds", "path": "Angry Birds.html", "icon": "icons/angry_birds.png" },
      { "name": "Bad Piggies", "path": "Bad Piggies.html", "icon": "icons/bad_piggies.png" },
      { "name": "Baldi's Basics", "path": "Baldis Basics.html", "icon": "icons/baldis_basics.png" },
      { "name": "Baldi's Basics: Ultra Decompile", "path": "Baldi Ultra Decompile.html", "icon": "icons/baldi_ultra_decompile.png" },
      { "name": "Basketball Stars", "path": "Basketball Stars.html", "icon": "icons/basketball_stars.png" },
      { "name": "Block Blast", "path": "Block Blast.html", "icon": "icons/block_blast.png" },

      { "name": "Chrome Dino", "path": "Google Dino.html", "icon": "icons/google_dino.png" },
      { "name": "Cluster Rush", "path": "Cluster Rush.html", "icon": "icons/cluster_rush.png" },
      { "name": "Cookie Clicker", "path": "Cookie Clicker.html", "icon": "icons/cookie_clicker.png" },
      { "name": "Crossy Road", "path": "Crossy Road.html", "icon": "icons/crossy_road.png" },

      { "name": "Hypper Sandbox", "path": "Hypper Sandbox.html", "icon": "icons/hypper_sandbox.png" },
      { "name": "Just Fall.LOL", "path": "Just Fall.lol.html", "icon": "icons/just_fall.png" },
      { "name": "Minecraft", "path": "Minecraft.html", "icon": "icons/minecraft.png" },
      { "name": "Moto X3M", "path": "Moto X3m.html", "icon": "icons/moto_x3m.png" },
      { "name": "Obby 99% Will Lose", "path": "Obby 99% will lose.html", "icon": "icons/obby.png" },
      { "name": "OvO", "path": "OvO.html", "icon": "icons/ovo.png" },
      { "name": "Paper.io 2", "path": "Paper.io.html", "icon": "icons/paper_io.png" },
      { "name": "Plants vs. Zombies", "path": "Plants VS Zombies.html", "icon": "icons/pvz.png" },
      { "name": "Raldi's Crackhouse", "path": "Raldis Crackhouse.html", "icon": "icons/raldis_crackhouse.png" },
      { "name": "Red Ball 4", "path": "Red Ball 4.html", "icon": "icons/red_ball_4.png" },
      { "name": "Retro Bowl", "path": "Retro Bowl.html", "icon": "icons/retro_bowl.png" },
      { "name": "Riddle School", "path": "Riddle School.html", "icon": "icons/riddle_school.png" },
      { "name": "Riddle School 2", "path": "Riddle School 2.html", "icon": "icons/riddle_school_2.png" },
      { "name": "Riddle School 3", "path": "Riddle School 3.html", "icon": "icons/riddle_school_3.png" },
      { "name": "Slope 2", "path": "Slope 2.html", "icon": "icons/slope_2.png" },
      { "name": "Snow Rider 3D", "path": "Snow Rider.html", "icon": "icons/snow_rider.png" },
      { "name": "Subway Surfers: St. Petersburg", "path": "Subway Surfers: St .Petersburg.html", "icon": "icons/subway_surfers.png" },
      { "name": "Super Mario Bros", "path": "Super Mario Bross.html", "icon": "icons/super_mario_bros.png" },
      { "name": "Tag", "path": "tag/index.html", "icon": "icons/tag.png" },
      { "name": "The Impossible Quiz", "path": "Impossible Quiz.html", "icon": "icons/impossible_quiz.png" },
      { "name": "The World's Hardest Game", "path": "World's Hardest Game.html", "icon": "icons/worlds_hardest_game.png" },
      { "name": "Tomb of the Mask", "path": "Tomb Of The Mask.html", "icon": "icons/tomb_of_the_mask.png" },
      { "name": "Undertale Yellow", "path": "Undertale Yellow.html", "icon": "icons/undertale_yellow.png" },
      { "name": "Wordle", "path": "Wordle.html", "icon": "icons/wordle.png" }
    ];

    async function fetchGameLibrary() {
      try {
        const res = await fetch(GAMES_JSON_URL + "?v=" + Date.now(), { cache: "no-cache" });
        if (!res.ok) throw new Error("Could not load games.json");
        allGames = await res.json();
      } catch (err) {
        console.warn("Using fallback game database:", err);
        allGames = fallbackGames;
      }
      if (countPill) countPill.textContent = `${allGames.length} Games`;
      renderGames();

      const autoLaunch = sessionStorage.getItem("athyx_launch_game");
      if (autoLaunch) {
        sessionStorage.removeItem("athyx_launch_game");
        try {
          const gameObj = JSON.parse(autoLaunch);
          const found = allGames.find(g => g.name === gameObj.name || g.path === gameObj.path) || gameObj;
          setTimeout(() => launchGame(found), 150);
        } catch(e) {}
      }
    }

    function toggleFavorite(gameName, e) {
      if (e) e.stopPropagation();
      const index = favorites.indexOf(gameName);
      if (index > -1) {
        favorites.splice(index, 1);
      } else {
        favorites.push(gameName);
      }
      localStorage.setItem("athyx_favorites", JSON.stringify(favorites));
      renderGames();
    }

    function getFilteredGames() {
      const query = searchBox.value.trim().toLowerCase();
      let list = allGames.filter(g => g.name.toLowerCase().includes(query));

      
      list.sort((a, b) => {
        const aFav = favorites.includes(a.name) ? 1 : 0;
        const bFav = favorites.includes(b.name) ? 1 : 0;
        return bFav - aFav;
      });

      return list;
    }

    function renderGames() {
      const list = getFilteredGames();
      gridEl.innerHTML = "";

      if (list.length === 0) {
        gridEl.innerHTML = `
          <div class="state-message">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>No games found matching your selection.</span>
          </div>
        `;
        return;
      }

      list.forEach(game => {
        const isFav = favorites.includes(game.name);
        const rawIcon = game.icon ? (game.icon.startsWith("http") ? game.icon : REPO_BASE + encodeURI(game.icon)) : "";
        const iconUrl = rawIcon ? (rawIcon + (rawIcon.includes("?") ? "&" : "?") + "t=" + Date.now()) : "";

        const card = document.createElement("div");
        card.className = "game-card";

        card.innerHTML = `
          <div class="thumb-wrapper">
            ${iconUrl ? `<img class="game-thumb" src="${iconUrl}" alt="${game.name}" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">` : ""}
            <i class="fa-solid fa-gamepad thumb-fallback" style="${iconUrl ? 'display:none;' : ''}"></i>
            <div class="play-overlay">
              <div class="play-icon"><i class="fa-solid fa-play"></i></div>
            </div>
            <button class="fav-btn ${isFav ? 'active' : ''}" title="${isFav ? 'Remove from favorites' : 'Add to favorites'}">
              <i class="fa-${isFav ? 'solid' : 'regular'} fa-star"></i>
            </button>
          </div>
          <div class="game-info">
            <span class="game-title" title="${game.name}">${game.name}</span>
          </div>
        `;

        card.querySelector(".fav-btn").onclick = (e) => toggleFavorite(game.name, e);
        card.onclick = () => launchGame(game);

        gridEl.appendChild(card);
      });
    }

    async function launchGame(game) {
      activeGameObj = game;
      loadingModalText.textContent = `Loading ${game.name}...`;
      loadingModal.classList.add("show");

      let gameUrl = REPO_BASE + encodeURI(game.path);
      let gameBaseFolder = gameUrl.substring(0, gameUrl.lastIndexOf('/') + 1);

      try {
        const res = await fetch(gameUrl);
        if (!res.ok) throw new Error("Status " + res.status);
        let html = await res.text();

        
        
        const iframeMatch = html.match(/<iframe\b[^>]*?\bsrc=["']([^"']+\.html(?:\?[^"']*)?)["']/i);
        if (iframeMatch && iframeMatch[1]) {
          let nestedUrl = iframeMatch[1];
          if (!/^https?:\/\//i.test(nestedUrl)) {
            nestedUrl = gameBaseFolder + nestedUrl.replace(/^(\.\/|\/)/, '');
          }
          try {
            const nestedRes = await fetch(nestedUrl);
            if (nestedRes.ok) {
              html = await nestedRes.text();
              gameUrl = nestedUrl;
              gameBaseFolder = gameUrl.substring(0, gameUrl.lastIndexOf('/') + 1);
            }
          } catch(errNested) {
            console.warn("Could not unwrap nested iframe HTML:", errNested);
          }
        }

        document.body.classList.add("game-active");

        
        const baseMatch = html.match(/<base\s+[^>]*href=["']([^"']+)["']/i);
        const resolvedBase = baseMatch ? baseMatch[1] : gameBaseFolder;
        const absoluteBase = resolvedBase.endsWith('/') ? resolvedBase : resolvedBase + '/';

        
        html = html.replace(/streamingAssetsUrl\s*:\s*(["'])(?!https?:\/\/)(.*?)\1/gi, (match, quote, relPath) => {
          const abs = absoluteBase + relPath.replace(/^(\.\/|\/)/, '');
          return `streamingAssetsUrl: "${abs}"`;
        });

        
        const engineShim = `
<script>
(function() {
  const resolvedBase = ${JSON.stringify(resolvedBase)};
  const absoluteBase = ${JSON.stringify(absoluteBase)};

  try {
    Object.defineProperty(Document.prototype, 'URL', { get: function() { return resolvedBase; }, configurable: true });
    Object.defineProperty(Document.prototype, 'documentURI', { get: function() { return resolvedBase; }, configurable: true });
  } catch(e) {}
  try {
    Object.defineProperty(document, 'URL', { get: function() { return resolvedBase; }, configurable: true });
    Object.defineProperty(document, 'documentURI', { get: function() { return resolvedBase; }, configurable: true });
  } catch(e) {}

  // Scirra Construct 3 & 2 RuntimeInterface shim (prevents Construct from defaulting to file:/// due to origin === "null")
  try {
    let _origRuntimeInterface = self.RuntimeInterface;
    Object.defineProperty(self, 'RuntimeInterface', {
      get: function() { return _origRuntimeInterface; },
      set: function(Cls) {
        if (typeof Cls === 'function') {

            constructor(opts) {
              opts = opts || {};
              opts.runtimeBaseUrl = absoluteBase;
              super(opts);

            }

        } else {

        }
      },
      configurable: true
    });
  } catch(e) {}

  // Fetch interceptor to resolve file:/// and relative paths against absoluteBase
  if (window.fetch) {
    const origFetch = window.fetch;
    window.fetch = function(input, init) {
      if (typeof input === 'string') {
        if (input.startsWith('file:///')) {
          input = absoluteBase + input.replace(/^file:\\/\\/\\/?/, '');
        } else if (input.startsWith('/') && !input.startsWith('//')) {
          input = absoluteBase + input.replace(/^\\//, '');
        } else if (!/^https?:\\/\\//i.test(input) && !input.startsWith('data:') && !input.startsWith('blob:') && !input.startsWith('javascript:')) {
          input = absoluteBase + input.replace(/^(\\.\\/)/, '');
        }
      } else if (input instanceof Request) {
        let url = input.url;
        if (url.startsWith('file:///')) {
          url = absoluteBase + url.replace(/^file:\\/\\/\\/?/, '');
          input = new Request(url, input);
        } else if (url.startsWith('about:')) {
          url = absoluteBase + url.replace(/^about:[^/]*\\/?/, '');
          input = new Request(url, input);
        }

      return origFetch.call(this, input, init);

        } else if (!/^https?:\\/\\//i.test(targetUrl) && !targetUrl.startsWith('blob:') && !targetUrl.startsWith('data:')) {
          targetUrl = absoluteBase + targetUrl.replace(/^(\\.\\/|\\/)/, '');
        }
        if (/^https?:\\/\\//i.test(targetUrl) && !targetUrl.startsWith(location.origin)) {
          try {
            const blobCode = "importScripts(" + JSON.stringify(targetUrl) + ");";
            const blobUrl = URL.createObjectURL(new Blob([blobCode], { type: 'application/javascript' }));

  const OrigURL = window.URL;

        const defaultStyleShim = `
<style>
html, body {
  margin: 0 !important;
  padding: 0 !important;
  width: 100% !important;
  height: 100% !important;
  overflow: hidden !important;
  background: #000 !important;
}
*::-webkit-scrollbar {
  display: none !important;
  width: 0 !important;
  height: 0 !important;
}
* {
  scrollbar-width: none !important;
}

  width: 100% !important;
  height: 100% !important;
  border: none !important;
  display: block !important;
}
</style>`;

        
        const baseTag = baseMatch ? '' : `<base href="${gameBaseFolder}">`;
        const headInjection = baseTag + defaultStyleShim + engineShim;

        let cleanHtml;
        if (/<head[^>]*>/i.test(html)) {
          cleanHtml = html.replace(/<head[^>]*>/i, match => match + headInjection);
        } else if (/<html[^>]*>/i.test(html)) {
          cleanHtml = html.replace(/<html[^>]*>/i, match => match + `<head>${headInjection}</head>`);
        } else {
          cleanHtml = `<head>${headInjection}</head>` + html;
        }

        gameStageIframe.srcdoc = cleanHtml;
        gameStage.classList.add("show");

        
        try {
          window.parent.postMessage({ action: "athyx_game_active", active: true }, "*");
        } catch(e) {}
      } catch (err) {
        console.error("Failed to launch game:", err);
        alert(`Could not launch "${game.name}". Please check your internet connection.`);
      } finally {
        loadingModal.classList.remove("show");
      }
    }

    function reloadActiveGame() {
      if (activeGameObj) launchGame(activeGameObj);
    }

    function closeActiveGame() {
      gameStage.classList.remove("show");
      gameStageIframe.srcdoc = "";
      activeGameObj = null;
      document.body.classList.remove("game-active");
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      }
      try {
        window.parent.postMessage({ action: "athyx_game_active", active: false }, "*");
      } catch(e) {}
    }

    function toggleStageFullscreen() {
      if (!document.fullscreenElement) {
        gameStage.requestFullscreen().catch(err => console.error(err));
      } else {
        document.exitFullscreen();
      }
    }

    
    searchBox.addEventListener("input", () => {
      clearSearchBtn.style.display = searchBox.value ? "block" : "none";
      renderGames();
    });

    clearSearchBtn.addEventListener("click", () => {
      searchBox.value = "";
      clearSearchBtn.style.display = "none";
      searchBox.focus();
      renderGames();
    });

    
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && gameStage.classList.contains("show")) {
        closeActiveGame();
      }
    });

    
    fetchGameLibrary();
  </script>
