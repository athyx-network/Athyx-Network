<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angry Birds</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }
    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    #gameContainer {
      width: 100% !important;
      height: 100% !important;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #gameContainer canvas {
      width: 100% !important;
      height: 116% !important;
      position: absolute;
      top: 50% !important;
      left: 0 !important;
      transform: translateY(-50%) !important;
      display: block !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
    }
  </style>
  <script>
    // Define dummy gadget and google objects to prevent any reference errors
    window.gadgets = { util: { runOnLoadHandlers: function() {} } };
    window.google = { csi: { tickDl: function() {} } };

    // Suppress Unity and runtime error alerts/prompts
    window.alert = function(msg) {
      console.warn('Suppressed alert:', msg);
    };
    window.onerror = function(msg, url, line) {
      console.warn('Suppressed error:', msg, url, line);
      return true; // Prevents the error from propagating to UnityLoader
    };
  </script>
  <script src="https://cdn.jsdelivr.net/gh/lee2sman/everyday@d45d601d2c4d60adf809a0b677c00b7d12aba7e9/96/TemplateData/UnityProgress.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/gertdoro/UnityExplorer@cffa09e09790018403c996d37adb6c4450e8f6c6/Runtime/birds/birds.js"></script>
</head>
<body>
  <div id="gameContainer"></div>

  <script>
    if (typeof UnityLoader !== 'undefined') {
      // Disable UnityLoader internal error popup/alert
      if (UnityLoader.Error) {
        UnityLoader.Error.handler = function(e, t) {
          console.warn('UnityLoader error caught and suppressed:', e);
        };
      }
      if (UnityLoader.compatibilityCheck) {
        UnityLoader.compatibilityCheck = function(e, t, r) {
          if (typeof t === 'function') t();
        };
      }
    }

    var gameInstance = UnityLoader.instantiate("gameContainer", "https://cdn.jsdelivr.net/gh/gertdoro/UnityExplorer@cffa09e09790018403c996d37adb6c4450e8f6c6/Runtime/birds/birds.json", {
      width: "100%",
      height: "100%",
      onProgress: typeof UnityProgress === 'function' ? UnityProgress : null,
      Module: {
        errorhandler: function(e) {
          console.warn('Unity errorhandler:', e);
          return true;
        },
        onRuntimeInitialized: function() {
          if (typeof UnityProgress === 'function' && typeof gameInstance !== 'undefined') {
            UnityProgress(gameInstance, "complete");
          }
        }
      }
    });
  </script>
</body>
</html>
