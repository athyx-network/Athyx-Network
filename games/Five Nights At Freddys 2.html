<!doctype html>
<html lang="en">
<head>
  <base href="https://cdn.jsdelivr.net/gh/bubblfan/fnaf@latest/2/" />
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, target-densitydpi=device-dpi" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="HandheldFriendly" content="true" />
  <title>Five Nights at Freddy's 2</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" type="text/css" href="style.css" />
  <style>
    /* Complete scrollbar removal & canvas auto-fit for FNAF 2 */
    html, body {
      width: 100vw !important;
      height: 100vh !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      background-color: #1d1d1d !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
    }

    *::-webkit-scrollbar,
    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    .game-container {
      width: 100vw !important;
      height: 100vh !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      overflow: hidden !important;
    }

    #MMFCanvas {
      max-width: 100vw !important;
      max-height: 100vh !important;
      width: auto !important;
      height: auto !important;
      aspect-ratio: 16 / 9;
      object-fit: contain;
      display: block !important;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <canvas id="MMFCanvas" width="1280" height="720">
      Your browser does not support Canvas, Please try again.
    </canvas>
  </div>
  <div id="progress-container">
    <div style="margin-bottom: 6px">
      Downloading... <span id="download-text">0%</span>
    </div>
    <div style="width: 100%; background: #444; border-radius: 6px; overflow: hidden;">
      <div id="download-bar" style="height: 10px; background: #3b82f6; width: 0%; transition: width 0.2s;"></div>
    </div>
    <div style="margin: 12px 0 6px">
      Extracting... <span id="extract-text">0%</span>
    </div>
    <div style="width: 100%; background: #444; border-radius: 6px; overflow: hidden;">
      <div id="extract-bar" style="height: 10px; background: #10b981; width: 0%; transition: width 0.2s;"></div>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
